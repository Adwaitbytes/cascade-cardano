<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><title>Cascade avatar</title><link rel="stylesheet" href="assets/social.css" />
<style>
  .frame { width: 400px; height: 400px; background: #0b0b0c; }
  .frame svg { position: absolute; inset: 0; width: 400px; height: 400px; }
</style></head>
<body><div class="frame" id="frame">
<!-- The web app tile, full bleed: the ink square fills the canvas so X's circle crop shows only ink, and the 30-unit viewBox keeps the glyph inside the inner 80% circle. -->
<svg viewBox="-1 -1 30 30" aria-hidden="true"><g fill="#f3f6f4"><rect x="10.5" y="6" width="7" height="5" rx="1" /><rect x="13" y="11" width="2" height="3" /><rect x="8" y="13" width="12" height="2" /><rect x="6" y="17" width="6" height="5" rx="1" /><rect x="16" y="17" width="6" height="5" rx="1" opacity="0.45" /></g></svg>
</div></body></html>
