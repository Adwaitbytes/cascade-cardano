# Yaci DevKit v0.12.0-beta5 genesis overrides for the Cascade local devnet.
# The Docker build fixes protocolMagic at 42 and networkId at Testnet.

# Yano bootstraps the chain, then the Haskell cardano-node takes over.
nodeMode=companion

# Match preprod's per-tx execution budget (17.5M memory) so a tx that fits
# preprod also fits the devnet. The beta5 default is 16.5M.
maxTxExUnitsMem=17500000
maxTxExUnitsSteps=10000000000
